[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-video-studio"
version = "0.1.0"
description = "Universal, multi-channel AI video production platform with modular pipeline architecture."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Universal Studio Engineering Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "pillow>=10.0.0",
    "edge-tts>=6.1.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
